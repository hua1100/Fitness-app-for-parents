paths:
  # 通知 API
  /api/notifications:
    get:
      tags:
        - 通知
      summary: 取得通知列表
      description: 取得用戶的通知列表
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
          description: 只取得未讀通知
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  meta:
                    $ref: '#/components/schemas/Pagination'

  /api/notifications/unread-count:
    get:
      tags:
        - 通知
      summary: 取得未讀通知數量
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      count:
                        type: integer

  /api/notifications/{id}/read:
    put:
      tags:
        - 通知
      summary: 標記通知為已讀
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/notifications/read-all:
    put:
      tags:
        - 通知
      summary: 標記所有通知為已讀
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: 已標記數量

  # 獎勵 API
  /api/rewards:
    get:
      tags:
        - 獎勵
      summary: 取得獎勵列表
      description: 取得可兌換的獎勵列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reward'

  /api/rewards/{id}/redeem:
    post:
      tags:
        - 獎勵
      summary: 兌換獎勵
      description: 使用點數兌換獎勵
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 獎勵 ID
      responses:
        '200':
          description: 兌換成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/RedemptionRecord'
        '400':
          description: 點數不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/rewards/redemptions:
    get:
      tags:
        - 獎勵
      summary: 取得兌換記錄
      description: 取得用戶的獎勵兌換記錄
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RedemptionRecord'
                  meta:
                    $ref: '#/components/schemas/Pagination'

  /api/rewards/redemptions/{id}/complete:
    put:
      tags:
        - 獎勵
      summary: 完成兌換
      description: 子女確認長輩的獎勵兌換已完成
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 兌換記錄 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  # 成就 API
  /api/achievements:
    get:
      tags:
        - 成就
      summary: 取得成就列表
      description: 取得所有成就及用戶的解鎖狀態
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Achievement'
                        - type: object
                          properties:
                            unlocked:
                              type: boolean
                            unlockedAt:
                              type: string
                              format: date-time
                              nullable: true

  /api/achievements/unlocked:
    get:
      tags:
        - 成就
      summary: 取得已解鎖成就
      description: 取得用戶已解鎖的成就列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Achievement'

  # 語音 API
  /api/voice/messages:
    get:
      tags:
        - 語音
      summary: 取得語音訊息列表
      description: 取得用戶收到的語音訊息
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VoiceMessage'
                  meta:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags:
        - 語音
      summary: 發送語音訊息
      description: 發送語音訊息給指定用戶
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
                - receiverId
              properties:
                audio:
                  type: string
                  format: binary
                  description: 語音檔案
                receiverId:
                  type: string
                  description: 接收者 ID
                duration:
                  type: integer
                  description: 語音長度（秒）
      responses:
        '201':
          description: 發送成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/VoiceMessage'

  /api/voice/messages/{id}/play:
    post:
      tags:
        - 語音
      summary: 播放語音訊息
      description: 記錄語音訊息被播放，增加播放次數
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 語音訊息 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      playCount:
                        type: integer

  /api/voice/messages/{id}:
    delete:
      tags:
        - 語音
      summary: 刪除語音訊息
      description: 刪除指定的語音訊息
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 語音訊息 ID
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
